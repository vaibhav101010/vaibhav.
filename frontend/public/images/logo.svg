      <stop offset="30%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#f0d080"/>
      <stop offset="70%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7c5c1e"/>
