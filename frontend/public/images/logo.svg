  <path d="M184 80 C190 75 188 68 180 72 M184 120 C190 125 188 132 180 128" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Corner flourishes -->
  <path d="M38 38 C30 30 25 35 32 42 M38 38 C30 46 35 48 42 42" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>
  <path d="M162 38 C170 30 175 35 168 42 M162 38 C170 46 165 48 158 42" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>
  <path d="M38 162 C30 170 35 175 42 168 M38 162 C46 170 48 165 42 158" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>
  <path d="M162 162 C170 170 165 175 158 168 M162 162 C154 170 152 165 158 158" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>
  
